<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kết quả tìm kiếm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <style>
        :root{ --bg:#020617; --border:rgba(255,255,255,.06); --text:#f8fafc; }
        body{ background: radial-gradient(circle at top left, rgba(99,102,241,.12), transparent 30%), var(--bg); color:var(--text); font-family:Inter, sans-serif; }
        .glass{ background:rgba(15,23,42,.72); border:1px solid var(--border); backdrop-filter:blur(12px); }
        .loader-spin{ animation:spin 1s linear infinite; }
        @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
        select option { background-color: #0f172a; color: #f8fafc; }
        /* CSS tô màu highlight từ khóa tìm kiếm */
        mark { background-color: rgba(99,102,241,0.4); color: #fff; padding: 0 2px; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 lg:p-8">

    <div class="max-w-[1200px] mx-auto">
        <header class="glass p-6 rounded-3xl mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                <div>
                    <a href="/" class="inline-flex items-center gap-2 text-indigo-400 hover:text-indigo-300 transition mb-3 text-sm font-medium">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại Dashboard
                    </a>
                    <h1 class="text-3xl font-semibold">Kết quả: <span id="displayQuery" class="text-indigo-400"></span></h1>
                    <p class="text-slate-400 mt-2 text-sm">Tìm thấy <span id="totalResults" class="font-bold text-white">0</span> bài viết phù hợp.</p>
                </div>
                <div class="flex items-center gap-3 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                    <span class="text-sm text-slate-400 pl-2">Mốc thời gian:</span>
                    <select id="timeFilter" onchange="resetAndSearch()" class="h-10 px-3 rounded-xl bg-slate-800 border-none outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition cursor-pointer">
                        <option value="all">Tất cả thời gian</option>
                        <option value="24h">24 giờ qua</option>
                        <option value="48h">48 giờ qua</option>
                        <option value="7d">7 ngày qua</option>
                    </select>
                </div>
            </div>
            
            <div id="relatedEntitiesBox" class="hidden border-t border-white/10 pt-4 mt-2">
                <span class="text-xs text-slate-500 uppercase tracking-wider mr-3">Trending liên quan:</span>
                <div id="relatedEntities" class="inline-flex flex-wrap gap-2"></div>
            </div>
        </header>

        <div id="articlesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8"></div>
        
        <div id="loadMoreContainer" class="text-center hidden">
            <button onclick="loadMore()" class="px-8 py-3 rounded-full bg-slate-800 hover:bg-slate-700 border border-white/10 transition font-medium text-sm inline-flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Xem thêm bài viết
            </button>
        </div>
        
        <div id="loader" class="hidden justify-center py-10">
            <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full loader-spin"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        document.getElementById('displayQuery').innerText = `"${query}"`;

        let currentPage = 1;
        let hasNext = false;

        function resetAndSearch() {
            currentPage = 1;
            document.getElementById('articlesContainer').innerHTML = '';
            document.getElementById('loadMoreContainer').classList.add('hidden');
            performSearch();
        }

        function loadMore() {
            if(hasNext) {
                currentPage++;
                performSearch();
            }
        }

        // Hàm highlight bôi vàng văn bản
        function highlightText(text, keyword) {
            if(!keyword || !text) return text;
            const regex = new RegExp(`(${keyword})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        async function performSearch() {
            if (!query) return;
            const container = document.getElementById('articlesContainer');
            const timeFilter = document.getElementById('timeFilter').value;
            const loader = document.getElementById('loader');
            const loadMoreBtn = document.getElementById('loadMoreContainer');

            loader.classList.remove('hidden');
            loader.classList.add('flex');
            loadMoreBtn.classList.add('hidden');

            try {
                const response = await fetch(`/api/search/?q=${encodeURIComponent(query)}&time=${timeFilter}&page=${currentPage}&limit=10`);
                const data = await response.json();

                document.getElementById('totalResults').innerText = data.total;
                hasNext = data.has_next;

                // Render Related Entities (Chỉ render ở trang đầu tiên)
                if(currentPage === 1 && data.related && data.related.length > 0) {
                    const relatedBox = document.getElementById('relatedEntitiesBox');
                    const relatedDiv = document.getElementById('relatedEntities');
                    relatedBox.classList.remove('hidden');
                    relatedDiv.innerHTML = data.related.map(kw => 
                        `<a href="/search/?q=${encodeURIComponent(kw.replace(/_/g, ' '))}" class="text-xs px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 border border-indigo-500/20 transition cursor-pointer">
                            #${kw.replace(/_/g, ' ')}
                        </a>`
                    ).join('');
                }

                if (data.results.length === 0 && currentPage === 1) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-20 glass rounded-3xl"><i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i><p>Không tìm thấy bài báo nào.</p></div>`;
                }

                data.results.forEach(article => {
                    const highlightedTitle = highlightText(article.title, query);
                    const card = document.createElement('div');
                    card.className = "glass rounded-2xl p-6 border border-white/5 hover:border-indigo-500/30 transition duration-300 flex flex-col";
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">
                                <i class="fa-regular fa-folder-open mr-1"></i> ${article.category || 'Tin tức'}
                            </span>
                            <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i> ${article.published_at}</span>
                        </div>
                        <h3 class="text-lg font-semibold leading-snug mb-4">${highlightedTitle}</h3>
                        <div class="mt-auto flex items-center justify-between border-t border-white/5 pt-4">
                            <p class="text-xs text-slate-400 bg-black/20 px-2 py-1 rounded">Nguồn: ${article.source}</p>
                            <a href="${article.url}" target="_blank" class="inline-flex items-center gap-1.5 text-indigo-400 hover:text-indigo-300 text-sm font-medium">
                                Chi tiết <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                if(hasNext) loadMoreBtn.classList.remove('hidden');

            } catch (error) { console.error("Lỗi:", error); }
            
            loader.classList.add('hidden');
            loader.classList.remove('flex');
        }

        resetAndSearch();
    </script>
</body>
</html>
