<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trend Intelligence Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
:root { --bg:#020617; --border:rgba(255,255,255,.06); --text:#f8fafc; }
body { background: radial-gradient(circle at top left, rgba(99,102,241,.12), transparent 30%), var(--bg); color:var(--text); font-family:Inter, sans-serif; }
.glass { background:rgba(15,23,42,.72); border:1px solid var(--border); backdrop-filter:blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.22); }
.card-hover:hover { transform:translateY(-3px); border-color:rgba(99,102,241,.35); background:rgba(255,255,255,.025); }
.active-item { border-color:rgba(99,102,241,.5)!important; background:rgba(99,102,241,.08)!important; }
.sparkline { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
select option { background-color: #0f172a; color: #f8fafc; }
</style>
</head>
<body class="overflow-x-hidden">

<div class="max-w-[1700px] mx-auto px-4 lg:px-8 py-6">
    <header class="mb-8 glass rounded-3xl px-6 py-5">
        <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-6">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <div class="relative"><div class="w-2.5 h-2.5 bg-red-500 rounded-full"></div><div class="absolute inset-0 bg-red-500 rounded-full animate-ping"></div></div>
                    <span class="uppercase tracking-[0.3em] text-xs text-slate-400">Realtime Analytics</span>
                </div>
                <h1 class="text-4xl font-semibold tracking-tight">Trend Intelligence</h1>
            </div>
            <div class="flex flex-wrap gap-4 items-center">
                <select id="timeFilter" onchange="fetchAllData()" class="h-12 px-4 rounded-2xl bg-slate-900/80 border border-white/5 outline-none focus:border-indigo-500 text-sm transition cursor-pointer">
                    <option value="24h">🔥 24h qua</option>
                    <option value="48h">📈 48h qua</option>
                    <option value="7d">📅 7 ngày qua</option>
                    <option value="30d">🗓️ 30 ngày qua</option>
                </select>
                <select id="categoryFilter" onchange="fetchAllData()" class="h-12 px-4 rounded-2xl bg-slate-900/80 border border-white/5 outline-none focus:border-emerald-500 text-sm transition cursor-pointer text-emerald-100">
                    <option value="all">🌍 Tất cả chủ đề (AI LDA)</option>
                    <option value="chính trị & ngoại giao">🏛️Chính trị & Ngoại giao</option>
                    <option value="thể thao & bóng đá">⚽ Thể thao & Bóng đá</option>
                    <option value="doanh nghiệp & phát triển xanh">🌱 Doanh nghiệp</option>
                    <option value="tuyển sinh & giáo dục phổ thông">🏫 Tuyển sinh & Giáo dục</option>
                    <option value="chính trị quốc tế & xung đột">⚔️ Chính trị Quốc tế & Xung đột</option>
                    <option value="văn hóa & sự kiện xã hội">🎭 Văn hóa & Sự kiện Xã hội</option>
                    <option value="y tế, sức khỏe & thực phẩm">🏥 Y tế, Sức khỏe & Thực phẩm</option>
                    <option value="đời sống, gia đình & xã hội">👨‍👩‍👧‍👦 Đời sống, Gia đình & Xã hội</option>
                    <option value="giải trí & nghệ thuật">🎬 Giải trí & Nghệ thuật</option>
                    <option value="kinh tế, tài chính & ngân hàng">💰 Kinh tế, Tài chính & Ngân hàng</option>
                    <option value="quản lý hành chính & đô thị">🏢 Quản lý Hành chính & Đô thị</option>
                </select>
                <div class="w-[280px] relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input id="searchInput" type="text" placeholder="Tìm từ khóa..." class="w-full h-12 rounded-2xl bg-slate-900/70 border border-white/5 pl-11 pr-4 outline-none focus:border-indigo-500 text-sm"/>
                </div>
                <div class="flex bg-slate-900/80 border border-white/5 rounded-2xl p-1">
                    <button id="tab-keywords" onclick="switchMode('keywords')" class="px-5 h-10 rounded-xl bg-indigo-500 text-white text-sm font-medium transition">Keywords</button>
                    <button id="tab-topics" onclick="switchMode('topics')" class="px-5 h-10 rounded-xl text-slate-400 hover:text-white text-sm transition">Topics</button>
                </div>
                <button onclick="exportCSV()" class="h-12 px-5 rounded-2xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-download"></i> Export
                </button>
            </div>
        </div>
    </header>

    <section class="grid grid-cols-1 xl:grid-cols-12 gap-6">
        <aside class="xl:col-span-3">
            <div class="glass rounded-3xl p-5 h-[920px] flex flex-col">
                <div class="mb-4">
                    <h2 id="sidebar-title" class="text-2xl font-semibold">Trending Keywords</h2>
                    <p class="text-slate-500 text-sm">Live ranking stream</p>
                </div>
                <div id="skeleton-loader" class="space-y-4 w-full">
                    <div class="h-20 bg-slate-800/50 rounded-2xl animate-pulse"></div>
                    <div class="h-20 bg-slate-800/50 rounded-2xl animate-pulse"></div>
                    <div class="h-20 bg-slate-800/50 rounded-2xl animate-pulse"></div>
                    <div class="h-20 bg-slate-800/50 rounded-2xl animate-pulse"></div>
                    <div class="h-20 bg-slate-800/50 rounded-2xl animate-pulse"></div>
                </div>
                <div id="item-list" class="space-y-3 overflow-y-auto flex-1 pr-1 hidden"></div>
            </div>
        </aside>

        <main class="xl:col-span-9 space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="glass rounded-3xl p-6 lg:col-span-2">
                    <div class="mb-4 flex justify-between items-start">
                        <div>
                            <h2 id="chart-title" class="text-3xl font-semibold">Select Trend</h2>
                            <p id="chart-subtitle" class="text-slate-500">AI-powered analytics visualization</p>
                        </div>
                    </div>
                    <div id="trendChart" class="w-full h-[380px]"></div>
                </div>
                <div class="glass rounded-3xl p-6 flex flex-col">
                    <h2 class="text-xl font-semibold mb-2">Trend Cloud</h2>
                    <p class="text-slate-500 text-sm mb-4">Semantic intensity mapping</p>
                    <div id="wordCloud" class="w-full flex-1 min-h-[300px]"></div>
                </div>
            </div>

            <div class="glass rounded-3xl p-6">
                <h2 class="text-2xl font-semibold mb-6">Related Articles <span id="article-count" class="text-sm text-indigo-400 ml-2"></span></h2>
                <div id="articles" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
            </div>
        </main>
    </section>
</div>

<script>
let globalKeywords = []; let globalTopics = [];
let currentMode = 'keywords'; let currentChart = null; let wordCloudChart = null; let activeElement = null;

function renderWordCloud(data) {
    const wcDom = document.getElementById('wordCloud');
    if (!wordCloudChart) wordCloudChart = echarts.init(wcDom);
    
    let words = data.map(item => ({
        name: currentMode === 'keywords' ? item.keyword.replace(/_/g, ' ') : item.topic_name,
        value: currentMode === 'keywords' ? item.super_hot_score : Math.abs(item.acceleration * 100)
    }));

    const option = {
        tooltip: { show: true, backgroundColor: '#0f172a', textStyle: {color: '#fff'}, borderColor: 'rgba(255,255,255,0.1)' },
        series: [{
            type: 'wordCloud', shape: 'circle',
            left: 'center', top: 'center', width: '100%', height: '100%',
            sizeRange: [14, 45], rotationRange: [-45, 45],
            textStyle: {
                color: function () {
                    return 'rgb(' + [
                        Math.round(Math.random() * 100 + 100),
                        Math.round(Math.random() * 100 + 100),
                        Math.round(Math.random() * 255)
                    ].join(',') + ')';
                }
            },
            data: words
        }]
    };
    wordCloudChart.setOption(option);
}

function createSparkline(dataArray) {
    if(!dataArray || dataArray.length < 2) return '';
    const max = Math.max(...dataArray), min = Math.min(...dataArray);
    const range = max - min || 1;
    const width = 60, height = 24;
    const points = dataArray.map((val, i) => {
        const x = (i / (dataArray.length - 1)) * width;
        const y = height - ((val - min) / range) * height;
        return `${x},${y}`;
    }).join(' ');
    const isUp = dataArray[dataArray.length-1] >= dataArray[0];
    const color = isUp ? '#10b981' : '#f43f5e'; 
    
    return `<svg width="${width}" height="${height}" viewBox="0 -5 ${width} ${height+10}" class="overflow-visible">
              <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sparkline opacity-80" />
            </svg>`;
}

function switchMode(mode){
    currentMode = mode;
    document.getElementById('tab-keywords').className = mode === 'keywords' ? "px-5 h-10 rounded-xl bg-indigo-500 text-white text-sm font-medium transition" : "px-5 h-10 rounded-xl text-slate-400 hover:text-white text-sm transition";
    document.getElementById('tab-topics').className = mode === 'topics' ? "px-5 h-10 rounded-xl bg-indigo-500 text-white text-sm font-medium transition" : "px-5 h-10 rounded-xl text-slate-400 hover:text-white text-sm transition";
    
    const data = mode === 'keywords' ? globalKeywords : globalTopics;
    document.getElementById('sidebar-title').innerText = mode === 'keywords' ? 'Trending Keywords' : 'Macro Topics';
    
    renderList(data);
    renderWordCloud(data);
    if(data.length > 0) selectItem(data[0]);
}

async function fetchAllData(){
    document.getElementById('skeleton-loader').style.display = 'block';
    document.getElementById('item-list').style.display = 'none';
    
    const timeFilter = document.getElementById('timeFilter').value;
    const categoryFilter = document.getElementById('categoryFilter') ? document.getElementById('categoryFilter').value : 'all';

    try {
        const [kwRes, topicRes] = await Promise.all([ 
            fetch(`/api/trending/?time=${timeFilter}&category=${encodeURIComponent(categoryFilter)}`), 
            fetch('/api/topics/') 
        ]);
        
        const kwData = await kwRes.json();
        const topicData = await topicRes.json();
        
        globalKeywords = Array.isArray(kwData) ? kwData : [];
        globalTopics = Array.isArray(topicData) ? topicData : [];
        
        switchMode(currentMode);
    } catch(error) { 
        console.error("Fetch Error:", error); 
        globalKeywords = [];
        globalTopics = [];
    }

    document.getElementById('skeleton-loader').style.display = 'none';
    document.getElementById('item-list').style.display = 'block';
}

function renderList(data){
    const container = document.getElementById('item-list');
    container.innerHTML = '';
    const timeVal = document.getElementById('timeFilter').value;

    data.forEach((item, index) => {
        const isKeyword = currentMode === 'keywords';
        const title = isKeyword ? item.keyword.replace(/_/g, ' ') : item.topic_name;
        const subtitle = isKeyword ? item.dominant_topic : item.trend_type;
        
        // 🟢 ĐÃ SỬA: Nếu không phải 24h thì hiện VOL (tổng bài báo)
        const badge = isKeyword ? (timeVal !== '24h' ? `VOL ${item.super_hot_score}` : `HOT ${item.super_hot_score.toFixed(2)}`) : `ACC ${item.acceleration.toFixed(2)}`;        
        
        let arrData = [];
        if(isKeyword && item.trend_data) arrData = item.trend_data.map(d=>d.count).slice(-7);
        else if(item.chart_data) arrData = item.chart_data.map(d=>d.percentage).slice(-7);

        const sparklineSVG = createSparkline(arrData);

        const div = document.createElement('div');
        div.className = "glass border border-white/5 rounded-2xl p-4 cursor-pointer card-hover fade-in transition-all";
        div.innerHTML = `
            <div class="flex items-center justify-between">
                <div class="flex-1 min-w-0 pr-2">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-6 h-6 rounded bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-xs font-bold">${index + 1}</span>
                        <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 border border-slate-700">${badge}</span>
                    </div>
                    <h3 class="font-semibold text-sm truncate capitalize">${title}</h3>
                    <p class="text-[11px] text-slate-500 mt-1 truncate">${subtitle}</p>
                </div>
                <div class="flex-shrink-0">${sparklineSVG}</div>
            </div>`;
        
        div.onclick = () => {
            if(activeElement) activeElement.classList.remove('active-item');
            div.classList.add('active-item'); activeElement = div;
            selectItem(item);
        };
        container.appendChild(div);
    });
}

function selectItem(item){
    const isKeyword = currentMode === 'keywords';
    document.getElementById('chart-title').innerText = isKeyword ? item.keyword.replace(/_/g, ' ') : item.topic_name;
    document.getElementById('chart-subtitle').innerText = isKeyword ? `Topic: ${item.dominant_topic}` : item.trend_type;
    
    renderArticles(item.articles || []);
    renderChart(item, isKeyword);
}

function renderChart(item, isKeyword) {
    const chartDom = document.getElementById('trendChart');
    if(currentChart) currentChart.dispose();
    currentChart = echarts.init(chartDom);
    
    const rawData = item.chart_data || item.trend_data;
    if(!rawData || rawData.length === 0) return;

    // 🟢 ĐÃ SỬA: Đọc giá trị timeFilter để biết cần lùi lại bao nhiêu ngày
    const timeVal = document.getElementById('timeFilter').value;
    let daysToShow = 7; // Mặc định 24h, 48h, 7d sẽ xem chart 7 ngày cho có ngữ cảnh
    if (timeVal === '30d') daysToShow = 30; // Nếu chọn 30 ngày thì nới trục X ra 30

    const xData = [];
    const yData = [];
    const fullDateKeys = []; 
    
    const latestDate = new Date(rawData[rawData.length - 1].date);
    
    // 🟢 ĐÃ SỬA: Vòng lặp lấy số ngày động (Dynamic days)
    for (let i = daysToShow - 1; i >= 0; i--) {
        const d = new Date(latestDate);
        d.setDate(d.getDate() - i);
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`; 
        
        xData.push(`${month}/${day}`);
        fullDateKeys.push(dateStr);    
        
        const found = rawData.find(r => r.date === dateStr);
        yData.push(found ? (isKeyword ? found.count : found.percentage) : 0);
    }

    currentChart.setOption({
        tooltip: { trigger: 'axis', backgroundColor: '#0f172a', textStyle: { color: '#fff' } },
        grid: { top: 20, left: 40, right: 20, bottom: 30 },
        // Thêm minInterval: 1 để tự động giấu bớt lable trục X nếu chọn 30 ngày (tránh chữ đè lên nhau)
        xAxis: { type: 'category', data: xData, axisLabel: { color: '#64748b' } },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: 'rgba(255,255,255,.05)' } }, axisLabel: { color: '#64748b' } },
        series: [{
            data: yData, type: 'line', smooth: true, symbolSize: 8,
            lineStyle: { width: 3, color: '#6366f1' }, itemStyle: { color: '#818cf8' },
            areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [{offset:0, color:'rgba(99,102,241,.3)'}, {offset:1, color:'transparent'}]) }
        }]
    });

    currentChart.on('click', function(params) {
        const exactClickedDate = fullDateKeys[params.dataIndex]; 
        const filteredArticles = (item.articles || []).filter(article => {
            if (!article.published_at) return false;
            const articleDate = article.published_at.split(' ')[0];
            return articleDate === exactClickedDate;
        });
        renderArticles(filteredArticles, exactClickedDate);
    });
}

function renderArticles(articles, filterDate = null){
    const container = document.getElementById('articles');
    
    let titleText = `(${articles.length})`;
    if (filterDate) {
        const [y, m, d] = filterDate.split('-');
        titleText = `(Báo ngày ${d}/${m} - ${articles.length} bài)`;
    }
    document.getElementById('article-count').innerText = titleText;
    
    container.innerHTML = '';
    if(articles.length === 0){ container.innerHTML = `<p class="text-slate-500">Chưa có bài báo nào vào ngày này.</p>`; return; }

    articles.forEach(article => {
        container.innerHTML += `
            <div class="glass rounded-2xl p-5 border border-white/5 hover:border-indigo-500/30 transition">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-[11px] px-2 py-1 rounded bg-slate-800 text-slate-300">${article.category || 'News'}</span>
                    <span class="text-[11px] text-slate-500">${article.published_at.split(' ')[1] || article.published_at}</span>
                </div>
                <h3 class="font-medium text-sm leading-relaxed line-clamp-2 mb-4">${article.title}</h3>
                <a href="${article.url}" target="_blank" class="text-indigo-400 hover:text-indigo-300 text-xs font-semibold">Đọc bài viết <i class="fa-solid fa-arrow-right text-[10px]"></i></a>
            </div>`;
    });
}

document.getElementById('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter' && e.target.value.trim()) window.location.href = `/search/?q=${encodeURIComponent(e.target.value.trim())}`;
});

function exportCSV() {
    const data = currentMode === 'keywords' ? globalKeywords : globalTopics;
    if(!data.length) return alert("Không có dữ liệu để xuất!");
    let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
    if(currentMode === 'keywords') {
        csvContent += "Từ khóa,Chủ đề,Z-Score,Độ phổ biến,Gia tốc\n";
        data.forEach(r => csvContent += `"${r.keyword.replace(/_/g, ' ')}","${r.dominant_topic}",${r.z_score},${r.popularity},${r.trend}\n`);
    } else {
        csvContent += "Chủ đề,Gia tốc,Trạng thái\n";
        data.forEach(r => csvContent += `"${r.topic_name}",${r.acceleration},"${r.trend_type}"\n`);
    }
    const a = document.createElement('a');
    a.href = encodeURI(csvContent);
    a.download = `Trend_Report_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}

// Khởi chạy khi load
fetchAllData(); 
// setInterval(fetchAllData, 60000); 
</script>
</body>
</html>
